# Scrapes the OTel Collector's Prometheus exporter (infra/HTTP metrics) and,
# if a future release adds one, the API's own /metrics endpoint directly.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
