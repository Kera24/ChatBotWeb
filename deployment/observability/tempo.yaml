# Minimal single-binary Tempo config sized for a small VPS - local disk
# storage, short retention (7 days). Increase `retention` if disk allows.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 168h # 7 days
