name: Azure Validate Staging

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit SHA, tag, or branch to validate in staging
        required: true
        default: main
      run_live_validation:
        description: Run live staging smoke, telemetry, and alert validation
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_synthetic_bootstrap:
        description: Run staging synthetic widget bootstrap before live validation
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      run_rollback_drill:
        description: Run staging rollback drill planning/execution path
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      current_manifest_path:
        description: Current staging deployment manifest path from downloaded artifacts
        required: false
      target_manifest_path:
        description: Known-good staging deployment manifest path from downloaded artifacts
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-staging-live-validation
  cancel-in-progress: false

jobs:
  validate-staging:
    name: Validate live staging evidence
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/widget/package-lock.json
            packages/widget-sdk/package-lock.json
            tests/widget-browser/package-lock.json

      - name: Install dependencies
        run: |
          npm run api:install
          npm run web:install
          npm run widget-sdk:install
          npm run widget:install
          npm --prefix tests/widget-browser install
          npm --prefix tests/widget-browser run install:browsers

      - name: Repository gates
        run: |
          npm run verify
          npm run widget:admin:release:verify
          npm run widget:pilot:verify
          npm run widget:pilot:readiness
          npm run infra:azure:validate
          npm run azure:observability:validate
          npm run azure:release:test
          npm run widget:inspect:production
          npm run widget:bundle:check

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure staging prerequisite and what-if evidence
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'australiaeast' }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CONTAINER_APPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT }}
          AZURE_API_CONTAINER_APP: ${{ vars.AZURE_API_CONTAINER_APP }}
          AZURE_WEB_CONTAINER_APP: ${{ vars.AZURE_WEB_CONTAINER_APP }}
          AZURE_LOG_ANALYTICS_WORKSPACE: ${{ vars.AZURE_LOG_ANALYTICS_WORKSPACE }}
          AZURE_APPLICATION_INSIGHTS_NAME: ${{ vars.AZURE_APPLICATION_INSIGHTS_NAME }}
          AZURE_WIDGET_STORAGE_ACCOUNT: ${{ vars.AZURE_WIDGET_STORAGE_ACCOUNT }}
          AZURE_POSTGRES_HOST: ${{ vars.AZURE_POSTGRES_HOST }}
          STAGING_FRONT_DOOR_ENDPOINT: ${{ vars.STAGING_FRONT_DOOR_ENDPOINT }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: npm run azure:staging:validate -- --environment staging --execute

      - name: Seed staging synthetic widgets
        if: ${{ inputs.run_synthetic_bootstrap == 'true' }}
        env:
          APP_ENV: staging
          WIDGET_STAGING_SYNTHETIC_BOOTSTRAP: "1"
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'australiaeast' }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CONTAINER_APPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT }}
          AZURE_KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          AZURE_ACR_LOGIN_SERVER: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          AZURE_MIGRATION_IDENTITY_ID: ${{ vars.AZURE_MIGRATION_IDENTITY_ID }}
          AZURE_SYNTHETIC_WIDGET_BOOTSTRAP_JOB: ${{ vars.AZURE_SYNTHETIC_WIDGET_BOOTSTRAP_JOB }}
          API_IMAGE_REF: ${{ vars.AZURE_API_IMAGE_REF }}
          STAGING_CDN_HOST_NAME: ${{ vars.STAGING_CDN_HOST_NAME }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
        run: npm run azure:staging:seed-synthetic-widgets:job -- --environment staging --execute
      - name: Live browser smoke evidence
        if: ${{ inputs.run_live_validation == 'true' }}
        env:
          STAGING_APP_URL: ${{ vars.STAGING_APP_URL }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          STAGING_WIDGET_URL: ${{ vars.STAGING_WIDGET_URL }}
          STAGING_CDN_URL: ${{ vars.STAGING_CDN_URL }}
          STAGING_WIDGET_PUBLIC_KEY_ALPHA: ${{ secrets.STAGING_WIDGET_PUBLIC_KEY_ALPHA }}
          STAGING_WIDGET_PUBLIC_KEY_BETA: ${{ secrets.STAGING_WIDGET_PUBLIC_KEY_BETA }}
          STAGING_SYNTHETIC_ALPHA_ORIGIN: ${{ vars.STAGING_SYNTHETIC_ALPHA_ORIGIN }}
          STAGING_SYNTHETIC_BETA_ORIGIN: ${{ vars.STAGING_SYNTHETIC_BETA_ORIGIN }}
        run: npm run azure:staging:browser -- --environment staging --execute

      - name: Telemetry validation evidence
        if: ${{ inputs.run_live_validation == 'true' }}
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOG_ANALYTICS_WORKSPACE: ${{ vars.AZURE_LOG_ANALYTICS_WORKSPACE }}
          AZURE_APPLICATION_INSIGHTS_NAME: ${{ vars.AZURE_APPLICATION_INSIGHTS_NAME }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: npm run azure:staging:telemetry -- --environment staging --execute

      - name: Alert routing validation evidence
        if: ${{ inputs.run_live_validation == 'true' }}
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_STAGING_ACTION_GROUP_NAME: ${{ vars.AZURE_STAGING_ACTION_GROUP_NAME }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: npm run azure:staging:alerts -- --environment staging --execute

      - name: Rollback drill evidence
        if: ${{ inputs.run_rollback_drill == 'true' }}
        run: npm run azure:staging:rollback-drill -- --environment staging --current "${{ inputs.current_manifest_path }}" --to "${{ inputs.target_manifest_path }}" --execute

      - name: Upload staging validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-staging-validation
          path: artifacts/azure-staging-validation
          if-no-files-found: ignore
          retention-days: 14
