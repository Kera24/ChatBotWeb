name: Azure Deploy Staging

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Commit SHA, tag, or branch to deploy to staging
        required: true
        default: main
      deploy_infrastructure:
        description: Run Bicep what-if and deploy staging infrastructure
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      deploy_application:
        description: Build/push images, run migration job, deploy app revisions, and publish static artifacts
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging release candidate
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/widget/package-lock.json
            packages/widget-sdk/package-lock.json
            tests/widget-browser/package-lock.json

      - name: Install dependencies
        run: |
          npm run api:install
          npm run web:install
          npm run widget-sdk:install
          npm run widget:install
          npm --prefix tests/widget-browser install
          npm --prefix tests/widget-browser run install:browsers

      - name: Repository and controlled-pilot gates
        run: |
          npm run verify
          npm run widget:admin:release:verify
          npm run widget:pilot:verify
          npm run widget:pilot:readiness
          npm run infra:azure:validate

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure infrastructure what-if
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'australiaeast' }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: npm run infra:azure:whatif -- staging

      - name: Deploy staging infrastructure
        id: infrastructure
        if: ${{ inputs.deploy_infrastructure == 'true' }}
        env:
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'australiaeast' }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/azure-deployment/staging
          TEMP_BICEPPARAM="$(mktemp infrastructure/azure/environments/.staging-deploy-XXXXXX.generated.bicepparam)"
          cleanup() {
            rm -f "$TEMP_BICEPPARAM"
          }
          trap cleanup EXIT
          cp infrastructure/azure/environments/staging.bicepparam "$TEMP_BICEPPARAM"
          cat >> "$TEMP_BICEPPARAM" <<'BICEP_PARAM_OVERLAY'

          param postgresAdministratorPassword = readEnvironmentVariable('AZURE_POSTGRES_ADMIN_PASSWORD')
          BICEP_PARAM_OVERLAY
          OUTPUTS_FILE="artifacts/azure-deployment/staging/infrastructure-outputs.json"
          az deployment sub create \
            --location "$AZURE_LOCATION" \
            --parameters "$TEMP_BICEPPARAM" \
            --query properties.outputs \
            -o json > "$OUTPUTS_FILE"
          ACR_LOGIN_SERVER="$(node -e "const fs=require('fs'); const o=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(o.acrLoginServer?.value || '')" "$OUTPUTS_FILE")"
          RESOURCE_GROUP="$(node -e "const fs=require('fs'); const o=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(o.resourceGroupName?.value || '')" "$OUTPUTS_FILE")"
          if [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "Infrastructure deployment did not return acrLoginServer output." >&2
            exit 1
          fi
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "resource_group=$RESOURCE_GROUP" >> "$GITHUB_OUTPUT"

      - name: Resolve staging Azure resources
        id: azure_resources
        if: ${{ inputs.deploy_application == 'true' }}
        env:
          ACR_NAME: ${{ steps.infrastructure.outputs.acr_name || vars.AZURE_ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ steps.infrastructure.outputs.acr_login_server || vars.AZURE_ACR_LOGIN_SERVER }}
          AZURE_RESOURCE_GROUP: ${{ steps.infrastructure.outputs.resource_group || vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          ACR_NAME="${ACR_NAME:-}"
          ACR_LOGIN_SERVER="${ACR_LOGIN_SERVER:-}"
          if [ -z "$ACR_NAME" ] && [ -n "$ACR_LOGIN_SERVER" ]; then
            ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          fi
          if [ -z "$ACR_NAME" ]; then
            echo "AZURE_ACR_NAME is blank and no ACR name was produced by the infrastructure deployment. Run with deploy_infrastructure=true or configure AZURE_ACR_NAME." >&2
            exit 1
          fi
          RESOLVED_LOGIN_SERVER="$(az acr show --name "$ACR_NAME" --query loginServer -o tsv 2>/dev/null || true)"
          if [ -z "$RESOLVED_LOGIN_SERVER" ] && [ -n "${AZURE_RESOURCE_GROUP:-}" ]; then
            RESOLVED_LOGIN_SERVER="$(az acr show --resource-group "$AZURE_RESOURCE_GROUP" --name "$ACR_NAME" --query loginServer -o tsv 2>/dev/null || true)"
          fi
          if [ -z "$RESOLVED_LOGIN_SERVER" ]; then
            echo "Azure Container Registry '$ACR_NAME' was not found or is not accessible in the selected subscription." >&2
            exit 1
          fi
          echo "acr_name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$RESOLVED_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        if: ${{ inputs.deploy_application == 'true' }}
        run: az acr login --name "${{ steps.azure_resources.outputs.acr_name }}"

      - name: Build and push immutable images
        if: ${{ inputs.deploy_application == 'true' }}
        id: images
        env:
          ACR_LOGIN_SERVER: ${{ steps.azure_resources.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          if [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "ACR login server was not resolved; refusing to build application images." >&2
            exit 1
          fi
          SHA="${GITHUB_SHA}"
          API_IMAGE="$ACR_LOGIN_SERVER/chatbotweb-api:$SHA"
          WEB_IMAGE="$ACR_LOGIN_SERVER/chatbotweb-web:$SHA"
          docker build -f apps/api/Dockerfile -t "$API_IMAGE" .
          docker build -f apps/web/Dockerfile -t "$WEB_IMAGE" .
          docker push "$API_IMAGE"
          docker push "$WEB_IMAGE"
          API_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$API_IMAGE")"
          WEB_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$WEB_IMAGE")"
          echo "api_image=$API_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_image=$WEB_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build deployment manifest
        if: ${{ inputs.deploy_application == 'true' }}
        run: npm run azure:release:manifest -- --environment staging --api-image "${{ steps.images.outputs.api_image }}" --web-image "${{ steps.images.outputs.web_image }}"

      - name: Run migration job
        if: ${{ inputs.deploy_application == 'true' }}
        run: node scripts/azure-run-migration.mjs --environment staging --image "${{ steps.images.outputs.api_image }}" --execute

      - name: Deploy Container App revisions
        if: ${{ inputs.deploy_application == 'true' }}
        run: node scripts/azure-deploy-apps.mjs --environment staging --api-image "${{ steps.images.outputs.api_image }}" --web-image "${{ steps.images.outputs.web_image }}" --execute

      - name: Publish widget static release
        if: ${{ inputs.deploy_application == 'true' }}
        env:
          AZURE_WIDGET_STORAGE_ACCOUNT: ${{ vars.AZURE_WIDGET_STORAGE_ACCOUNT }}
        run: node scripts/publish-azure-widget-release.mjs --environment staging --execute

      - name: Deployed smoke
        if: ${{ inputs.deploy_application == 'true' }}
        env:
          AZURE_DEPLOYED_BASE_URL: ${{ vars.STAGING_APP_URL }}
          AZURE_DEPLOYED_API_URL: ${{ vars.STAGING_API_URL }}
          AZURE_DEPLOYED_WIDGET_URL: ${{ vars.STAGING_WIDGET_URL }}
          AZURE_DEPLOYED_CDN_URL: ${{ vars.STAGING_CDN_URL }}
        run: npm run azure:smoke -- --environment staging

      - name: Upload Azure deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-staging-deployment
          path: |
            artifacts/deployment-release
            artifacts/azure-deployment/staging
            artifacts/widget-release
          if-no-files-found: ignore
          retention-days: 14
