name: Azure Promote Pilot

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Workflow run ID that uploaded the azure-staging-deployment and azure-staging-validation artifacts
        required: true
      approval_note:
        description: Human-readable approval/change note
        required: true
      manual_accessibility_review_passed:
        description: Manual assistive-technology/accessibility review passed for pilot scope
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      manual_security_review_passed:
        description: Manual security review passed with no unresolved critical blockers
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      production_domain_plan_reviewed:
        description: Production-pilot domain, TLS, DNS, and header plan reviewed
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      rollback_operator_ready:
        description: Operator confirmed rollback runbook, known-good manifest, and support path
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      support_contact_ready:
        description: Pilot support contact and alert receiver path are ready
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      first_pilot_tenant_approved:
        description: First pilot tenant/widget enablement is approved and contains no customer data in validation evidence
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: azure-pilot-deploy
  cancel-in-progress: false

jobs:
  promote-pilot:
    name: Promote staged release to production pilot
    runs-on: ubuntu-latest
    environment: production-pilot

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download staged release artifact
        uses: actions/download-artifact@v4
        with:
          name: azure-staging-deployment
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Download staging validation evidence
        uses: actions/download-artifact@v4
        with:
          name: azure-staging-validation
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/azure-staging-validation

      - name: Validate staged deployment manifest
        run: node scripts/validate-deployment-manifest.mjs --manifest artifacts/deployment-release/manifest.json --release-dir artifacts/widget-release --expected-source-environment staging

      - name: Record manual production-pilot gate
        env:
          APPROVAL_NOTE: ${{ inputs.approval_note }}
          APPROVED_BY: ${{ github.actor }}
          MANUAL_ACCESSIBILITY_REVIEW_PASSED: ${{ inputs.manual_accessibility_review_passed }}
          MANUAL_SECURITY_REVIEW_PASSED: ${{ inputs.manual_security_review_passed }}
          PRODUCTION_DOMAIN_PLAN_REVIEWED: ${{ inputs.production_domain_plan_reviewed }}
          ROLLBACK_OPERATOR_READY: ${{ inputs.rollback_operator_ready }}
          SUPPORT_CONTACT_READY: ${{ inputs.support_contact_ready }}
          FIRST_PILOT_TENANT_APPROVED: ${{ inputs.first_pilot_tenant_approved }}
        run: |
          mkdir -p artifacts/production-pilot-readiness
          node -e "const fs=require('fs'); const bool=(v)=>v==='true'; const gate={schema_version:'1.0', approved_by:process.env.APPROVED_BY, approved_at:new Date().toISOString(), approval_note_length:(process.env.APPROVAL_NOTE||'').length, manual_accessibility_review_passed:bool(process.env.MANUAL_ACCESSIBILITY_REVIEW_PASSED), manual_security_review_passed:bool(process.env.MANUAL_SECURITY_REVIEW_PASSED), production_domain_plan_reviewed:bool(process.env.PRODUCTION_DOMAIN_PLAN_REVIEWED), rollback_operator_ready:bool(process.env.ROLLBACK_OPERATOR_READY), support_contact_ready:bool(process.env.SUPPORT_CONTACT_READY), first_pilot_tenant_approved:bool(process.env.FIRST_PILOT_TENANT_APPROVED), no_customer_data_in_validation:true}; fs.writeFileSync('artifacts/production-pilot-readiness/manual-gate.json', JSON.stringify(gate,null,2)+'\n');"

      - name: Validate production-pilot readiness gate
        env:
          PILOT_APPROVAL_NOTE: ${{ inputs.approval_note }}
        run: npm run azure:pilot:readiness -- --manifest artifacts/deployment-release/manifest.json --release-dir artifacts/widget-release --staging-report artifacts/azure-staging-validation/report.json --browser-smoke artifacts/azure-staging-validation/browser-smoke.json --telemetry artifacts/azure-staging-validation/telemetry.json --alerts artifacts/azure-staging-validation/alerts.json --rollback artifacts/azure-staging-validation/rollback.json --manual-gate artifacts/production-pilot-readiness/manual-gate.json

      - name: Extract release image refs
        id: manifest
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('artifacts/deployment-release/manifest.json','utf8')); console.log('api_image='+m.api_image.ref); console.log('web_image='+m.web_image.ref); console.log('release_id='+m.release_id);" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Production-pilot what-if
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'australiaeast' }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: npm run infra:azure:whatif -- pilot

      - name: Run production-pilot migration job
        run: node scripts/azure-run-migration.mjs --environment pilot --image "${{ steps.manifest.outputs.api_image }}" --execute

      - name: Deploy production-pilot Container App revisions
        run: node scripts/azure-deploy-apps.mjs --environment pilot --api-image "${{ steps.manifest.outputs.api_image }}" --web-image "${{ steps.manifest.outputs.web_image }}" --execute

      - name: Publish production-pilot widget static release
        env:
          AZURE_WIDGET_STORAGE_ACCOUNT: ${{ vars.AZURE_WIDGET_STORAGE_ACCOUNT }}
        run: node scripts/publish-azure-widget-release.mjs --environment pilot --release-dir artifacts/widget-release --execute

      - name: Production-pilot deployed smoke
        env:
          AZURE_DEPLOYED_BASE_URL: ${{ vars.PILOT_APP_URL }}
          AZURE_DEPLOYED_API_URL: ${{ vars.PILOT_API_URL }}
          AZURE_DEPLOYED_WIDGET_URL: ${{ vars.PILOT_WIDGET_URL }}
          AZURE_DEPLOYED_CDN_URL: ${{ vars.PILOT_CDN_URL }}
        run: npm run azure:smoke -- --environment pilot

      - name: Summarise release
        run: |
          echo "### Production-pilot promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: ${{ steps.manifest.outputs.release_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "API image: ${{ steps.manifest.outputs.api_image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Web image: ${{ steps.manifest.outputs.web_image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Approval note: ${{ inputs.approval_note }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Customer widget enablement remains manual/operational." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production-pilot deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-pilot-deployment
          path: |
            artifacts/deployment-release
            artifacts/azure-deployment/pilot
            artifacts/production-pilot-readiness
          if-no-files-found: ignore
          retention-days: 30
