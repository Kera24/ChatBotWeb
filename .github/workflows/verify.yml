name: Verify
#
# The primary, always-on gate for this repo: runs on every PR and every push
# to main, validating the CURRENT launch target - a single-VPS Docker
# Compose deployment (docker-compose.prod.yml). It intentionally does NOT
# run Azure infrastructure/observability/release-tooling validation
# unconditionally - Azure is a retained-for-the-future, not-yet-active
# deployment target (see docs/architecture/deployment.md, ADR-0027/0029),
# and gating every single PR on it (regardless of whether it touched
# anything Azure-related) is exactly the "Azure validated more strongly than
# the active VPS path" problem this workflow used to have. Azure validation
# still exists and still blocks merges - just scoped to when it's actually
# relevant, in azure-validate.yml (path-filtered on infrastructure/azure/**,
# scripts/azure-*.mjs, etc.), plus workflow_dispatch-only deploy/rollback/
# promote workflows for real Azure environments. Nothing about Azure's own
# validation was weakened - it just no longer runs redundantly here too.

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/widget/package-lock.json
            packages/widget-sdk/package-lock.json
            tests/widget-browser/package-lock.json

      - name: Install API dependencies
        run: npm run api:install

      - name: Install web dependencies
        run: npm run web:install

      - name: Install widget SDK dependencies
        run: npm run widget-sdk:install

      - name: Install widget app dependencies
        run: npm run widget:install

      - name: Install widget browser test dependencies
        run: npm --prefix tests/widget-browser install

      - name: Install Playwright Chromium
        run: npm --prefix tests/widget-browser run install:browsers

      - name: Run verification
        run: npm run verify

      - name: Run VPS release gate (Compose config + migrations)
        # --skip-verified-suites: api_tests/web_tests/web_lint/web_build/
        # eval_framework_tests already ran via `npm run verify` above - this
        # step adds the checks verify does NOT cover: docker-compose.prod.yml
        # + docker-compose.observability.yml config validation, and a real
        # `alembic upgrade head` against ephemeral Postgres via the actual
        # `migrate` Compose service. --migration-check-env-file points at the
        # checked-in, git-tracked example file (safe placeholder values only,
        # never a real secret) - see scripts/release-gate.mjs's own comments
        # for why this is a separate flag from --env-file.
        run: npm run vps:release:gate -- --skip-verified-suites --migration-check-env-file .env.production.example

      - name: Run widget pilot verification
        run: npm run widget:pilot:verify

      - name: Run widget operational validation
        run: npm run widget:ops:validate

      - name: Run widget pilot readiness
        run: npm run widget:pilot:readiness

      - name: Run widget admin release gate
        run: npm run widget:admin:release:verify

      - name: Upload VPS release gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vps-release-gate
          path: artifacts/release-gate
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload widget admin readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-admin-readiness
          path: artifacts/widget-admin-readiness
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload widget pilot readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-pilot-readiness
          path: artifacts/widget-pilot-readiness
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload widget pilot verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-pilot-verification
          path: artifacts/widget-pilot-verification
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload widget release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-release-artifacts
          path: artifacts/widget-release
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload widget browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: widget-browser-artifacts
          path: |
            tests/widget-browser/test-results
            tests/widget-browser/playwright-report
          if-no-files-found: ignore
          retention-days: 7
